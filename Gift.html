<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Gift & Tantangan Overlay - Final Transparent</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: transparent; /* Transparan asli tanpa layar hijau/magenta */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .gift-container {
      width: 440px;
      background-color: rgba(43, 45, 49, 0.78); /* Abu-abu transparan langsung */
      border-radius: 18px;
      padding: 14px 18px 10px 18px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Area Tampilan Pas 2 Baris */
    .gift-viewport {
      width: 100%;
      height: 136px; /* Tinggi pas untuk 2 baris (2 x 68px) */
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .gift-list {
      display: flex;
      flex-direction: column;
      transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Desain Per Baris */
    .gift-item {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }

    /* Stiker / Gambar Gift & Angka 1 */
    .gift-icon-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(56, 58, 64, 0.85);
      border-radius: 12px;
    }

    .gift-emoji {
      font-size: 36px;
      line-height: 1;
    }

    /* Angka Jumlah Gift (1) di Pojok Stiker */
    .gift-count {
      position: absolute;
      bottom: -3px;
      right: -3px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      background-color: rgba(30, 31, 34, 0.9);
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      line-height: 1.2;
    }

    /* Kolom Teks */
    .gift-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
    }

    .gift-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Nama Gift Small Caps */
    .gift-name {
      font-family: 'Montserrat', 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.8px;
      color: #d1d5db;
      white-space: nowrap;
    }

    .badge-emoji {
      font-size: 14px;
      line-height: 1;
    }

    /* Teks Tantangan Utama */
    .gift-action {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.2px;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    /* Aksen Warna untuk Tantangan Spesial */
    .gift-action.danger {
      color: #ff8787;
    }

    .gift-action.special {
      color: #69db7c;
    }

    /* Tombol Panah Bawah */
    .scroll-indicator {
      margin-top: 6px;
      padding: 4px 18px;
      background-color: rgba(56, 58, 64, 0.85);
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      animation: bounce 1.8s infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scroll-indicator svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
  </style>
</head>
<body>

  <div class="gift-container">
    <div class="gift-viewport" id="viewport">
      <div class="gift-list" id="giftList">
        
        <!-- 1. MAWAR -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">🌹</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴍᴀᴡᴀʀ</span>
              <span class="badge-emoji">🧣</span>
            </div>
            <div class="gift-action">Salah 1 warna</div>
          </div>
        </div>

        <!-- 2. DONAT -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">🍩</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴅᴏɴᴀᴛ</span>
              <span class="badge-emoji">🥨</span>
            </div>
            <div class="gift-action">Putar 90°</div>
          </div>
        </div>

        <!-- 3. CAHAYA BINTANG -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">✨</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴄᴀʜᴀʏᴀ ʙɪɴᴛᴀɴɢ</span>
              <span class="badge-emoji">💫</span>
            </div>
            <div class="gift-action">Tanpa pinset 30d</div>
          </div>
        </div>

        <!-- 4. BRAVO -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">👏</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ʙʀᴀᴠᴏ</span>
              <span class="badge-emoji">🏵️</span>
            </div>
            <div class="gift-action">Senggol papan</div>
          </div>
        </div>

        <!-- 5. AKU CINTA KAMU -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">🤟</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴀᴋᴜ ᴄɪɴᴛᴀ ᴋᴀᴍᴜ</span>
              <span class="badge-emoji">💝</span>
            </div>
            <div class="gift-action">Rusak 1 bagian</div>
          </div>
        </div>

        <!-- 6. PARFUM -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">🧴</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴘᴀʀғᴜᴍ</span>
              <span class="badge-emoji">🦢</span>
            </div>
            <div class="gift-action danger">BALIK PAPAN!</div>
          </div>
        </div>

        <!-- 7. PAUS MENYELAM -->
        <div class="gift-item">
          <div class="gift-icon-wrapper">
            <span class="gift-emoji">🐳</span>
            <span class="gift-count">1</span>
          </div>
          <div class="gift-info">
            <div class="gift-title-row">
              <span class="gift-name">ᴘᴀᴜs ᴍᴇɴʏᴇʟᴀᴍ</span>
              <span class="badge-emoji">🫧</span>
            </div>
            <div class="gift-action special">SETRIKAA</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Panah Bawah -->
    <div class="scroll-indicator" onclick="nextRow()" title="Klik untuk menggulir">
      <svg viewBox="0 0 24 24">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <script>
    const giftList = document.getElementById('giftList');
    const viewport = document.getElementById('viewport');
    const items = document.querySelectorAll('.gift-item');
    const visibleRows = 2;
    const itemHeight = 68;
    let currentIndex = 0;
    let timer;

    function updateScroll() {
      giftList.style.transform = `translateY(-${currentIndex * itemHeight}px)`;
    }

    function nextRow() {
      const maxIndex = items.length - visibleRows;
      if (maxIndex <= 0) return;

      currentIndex++;
      if (currentIndex > maxIndex) {
        currentIndex = 0;
      }
      updateScroll();
      resetTimer();
    }

    function prevRow() {
      const maxIndex = items.length - visibleRows;
      if (maxIndex <= 0) return;

      currentIndex--;
      if (currentIndex < 0) {
        currentIndex = maxIndex;
      }
      updateScroll();
      resetTimer();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) {
        nextRow();
      } else {
        prevRow();
      }
    });

    function resetTimer() {
      clearInterval(timer);
      timer = setInterval(nextRow, 3500);
    }

    resetTimer();
  </script>

</body>
</html>
