<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .overlay-container {
            background: rgba(18, 18, 24, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            min-width: 340px;
        }

        .banner-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            background: linear-gradient(90deg, #ff0050, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        .live-badge {
            background-color: #fe2c55;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(254, 44, 85, 0.6);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 10px;
            flex: 1;
        }

        .stat-label {
            color: #a0a0b0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="banner-text">Support Doa dan Follow</div>
        
        <div class="stats-row">
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>

            <div class="stat-box">
                <span class="stat-label">VIEWERS</span>
                <span class="stat-value" id="viewers">0</span>
            </div>

            <div class="stat-box">
                <span class="stat-label">TOTAL</span>
                <span class="stat-value" id="total">0</span>
            </div>
        </div>
    </div>

    <script>
        let totalViewers = 0;
        let testViewers = 0;

        function connectTikFinity() {
            const socket = new WebSocket('ws://localhost:21213/');

            socket.onopen = function() {
                // Indikator awal bahwa jalur ke TikFinity berhasil terhubung
                console.log('Terhubung ke TikFinity!');
            };

            socket.onmessage = function(event) {
                try {
                    const msg = JSON.parse(event.data);

                    // 1. Update jumlah penonton asli saat Live (VIEWERS)
                    if (msg.event === 'roomUser' && msg.data && typeof msg.data.viewerCount !== 'undefined') {
                        document.getElementById('viewers').innerText = msg.data.viewerCount.toLocaleString('id-ID');
                    }

                    // 2. Tambah hitungan total penonton masuk saat Live (TOTAL)
                    if (msg.event === 'member') {
                        totalViewers += 1;
                        document.getElementById('total').innerText = totalViewers.toLocaleString('id-ID');
                    }

                    // 3. Pemicu Tes lewat tombol Simulate (Follow / Like / Gift) di TikFinity
                    if (msg.event === 'follow' || msg.event === 'like' || msg.event === 'gift') {
                        testViewers += 1;
                        totalViewers += 1;
                        document.getElementById('viewers').innerText = testViewers.toLocaleString('id-ID');
                        document.getElementById('total').innerText = totalViewers.toLocaleString('id-ID');
                    }
                } catch (e) {
                    console.error('Gagal membaca data:', e);
                }
            };

            socket.onclose = function() {
                setTimeout(connectTikFinity, 3000);
            };

            socket.onerror = function() {
                socket.close();
            };
        }

        connectTikFinity();
    </script>

</body>
</html>
