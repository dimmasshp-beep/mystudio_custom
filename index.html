<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }

        .overlay-wrapper {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 18px;
            width: 340px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            color: #ffffff;
        }

        /* Teks Berjalan (Marquee) */
        .marquee-box {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .marquee-track {
            display: inline-block;
            animation: scrollText 8s linear infinite;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .marquee-track span {
            margin-right: 40px;
        }

        @keyframes scrollText {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* Baris Status LIVE & Penghitung */
        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .live-badge {
            background-color: #fe2c55;
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .counter-group {
            display: flex;
            gap: 12px;
        }

        .counter-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 8px;
            text-align: center;
            min-width: 82px;
        }

        .counter-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #b0b0c0;
            letter-spacing: 0.8px;
        }

        .counter-value {
            display: block;
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="overlay-wrapper">
        <div class="marquee-box">
            <div class="marquee-track">
                <span>Support Doa dan Follow</span>
                <span>Support Doa dan Follow</span>
            </div>
        </div>

        <div class="bottom-row">
            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>

            <div class="counter-group">
                <div class="counter-box">
                    <span class="counter-label">VIEWERS</span>
                    <span class="counter-value" id="viewers">0</span>
                </div>

                <div class="counter-box">
                    <span class="counter-label">TOTAL</span>
                    <span class="counter-value" id="total">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let totalCount = 0;
        let simViewers = 0;

        function startTikFinitySocket() {
            const ws = new WebSocket('ws://localhost:21213/');

            ws.onopen = function() {
                console.log('Koneksi TikFinity Aktif');
            };

            ws.onmessage = function(event) {
                try {
                    const packet = JSON.parse(event.data);

                    // 1. Data Penonton Aktif (VIEWERS) saat Live
                    if (packet.event === 'roomUser' && packet.data && typeof packet.data.viewerCount !== 'undefined') {
                        document.getElementById('viewers').innerText = packet.data.viewerCount.toLocaleString('id-ID');
                    }

                    // 2. Data Penonton Masuk (TOTAL) saat Live
                    if (packet.event === 'member') {
                        totalCount += 1;
                        document.getElementById('total').innerText = totalCount.toLocaleString('id-ID');
                    }

                    // 3. Otomatis jalan saat tombol Simulate (Follow / Like / Gift) ditekan di TikFinity
                    if (packet.event === 'follow' || packet.event === 'like' || packet.event === 'gift') {
                        simViewers += 1;
                        totalCount += 1;
                        document.getElementById('viewers').innerText = simViewers.toLocaleString('id-ID');
                        document.getElementById('total').innerText = totalCount.toLocaleString('id-ID');
                    }
                } catch (err) {
                    console.error('Error parsing TikFinity data:', err);
                }
            };

            ws.onclose = function() {
                setTimeout(startTikFinitySocket, 3000);
            };

            ws.onerror = function() {
                ws.close();
            };
        }

        startTikFinitySocket();
    </script>

</body>
</html>
