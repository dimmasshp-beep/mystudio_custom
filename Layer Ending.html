<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720, height=1280, initial-scale=1.0">
<title>Layer 2 - Ending Fit 720x1280</title>
<style>
  @import url('https://googleapis.com');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 720px;
    height: 1280px;
    overflow: hidden;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
    color: #ffffff;
    position: relative;
  }

  /* Kanvas Utama Terpotong Pas 720x1280 dengan Sudut Membulat */
  .canvas-clip {
    position: relative;
    width: 720px;
    height: 1280px;
    border-radius: 36px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #4b127a 0%, #240740 60%, #11021f 100%);
    border: 6px solid rgba(216, 180, 254, 0.45);
  }

  /* Gelombang Ungu di Dalam Batas Potongan */
  .wave {
    position: absolute;
    width: 1450px;
    height: 1450px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(107, 33, 168, 0.05));
    border-radius: 43%;
    top: -520px;
    left: -365px;
    animation: drift 14s infinite linear;
    pointer-events: none;
  }

  .wave:nth-child(2) {
    width: 1550px;
    height: 1550px;
    background: linear-gradient(135deg, rgba(216, 180, 254, 0.16), rgba(88, 28, 135, 0.05));
    border-radius: 47%;
    top: -580px;
    left: -415px;
    animation: drift 20s infinite linear reverse;
    pointer-events: none;
  }

  @keyframes drift {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Partikel Bintang Halus */
  .sparkles {
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image: 
      radial-gradient(2px 2px at 140px 280px, #fff, transparent),
      radial-gradient(2px 2px at 600px 440px, #e9d5ff, transparent),
      radial-gradient(3px 3px at 260px 960px, #fff, transparent),
      radial-gradient(2px 2px at 540px 820px, #d8b4fe, transparent);
    animation: twinkle 4s infinite alternate ease-in-out;
    pointer-events: none;
  }

  @keyframes twinkle {
    0% { opacity: 0.35; }
    100% { opacity: 0.95; }
  }

  /* Teks Tengah */
  .center-content {
    position: absolute;
    z-index: 10;
    top: 480px;
    left: 64px;
  }

  .sub-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 34px;
    color: #e9d5ff;
    margin-bottom: -14px;
    margin-left: 6px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }

  .main-title {
    font-size: 112px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: transparent;
    -webkit-text-stroke: 2.5px rgba(233, 213, 255, 0.8);
    animation: pulseGlow 3s infinite alternate ease-in-out;
  }

  .main-title span {
    display: block;
  }

  @keyframes pulseGlow {
    0% {
      filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.25));
      -webkit-text-stroke: 2.5px rgba(233, 213, 255, 0.65);
    }
    100% {
      filter: drop-shadow(0 0 22px rgba(216, 180, 254, 0.75));
      -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.98);
    }
  }
</style>
</head>
<body>

  <div class="canvas-clip">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="sparkles"></div>

    <div class="center-content">
      <div class="sub-text">the stream is</div>
      <div class="main-title">
        <span>END</span>
        <span>ING!</span>
      </div>
    </div>
  </div>

</body>
</html>
