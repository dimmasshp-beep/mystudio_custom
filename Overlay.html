<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;font-family:'Segoe UI',sans-serif;color:#fff;padding:6px;overflow:hidden}
  .box{background:rgba(18,22,33,.78);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 10px 6px;width:215px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
  #list{display:flex;flex-direction:column;gap:8px;height:84px;overflow-y:auto;scrollbar-width:none}
  #list::-webkit-scrollbar{display:none}
  .item{display:flex;align-items:center;gap:9px;height:38px;flex-shrink:0;transition:transform .4s ease}
  .item.pop{animation:glow .5s ease}
  @keyframes glow{0%{transform:scale(1.04);filter:drop-shadow(0 0 8px #00f2fe)}100%{transform:scale(1)}}
  .ico{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0}
  .cnt{position:absolute;bottom:-2px;right:-3px;background:#fff;color:#111;font-size:11px;font-weight:800;min-width:16px;height:16px;padding:0 4px;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000}
  .txt{display:flex;flex-direction:column;overflow:hidden}
  .nm{font-size:10px;font-weight:700;color:#dcdcdc;white-space:nowrap}
  .ch{font-size:13.5px;font-weight:800;text-shadow:1px 1px 2px #000;white-space:nowrap}
  .ft{display:flex;justify-content:center;margin-top:6px}
  .btn{background:rgba(255,255,255,.18);border:none;border-radius:10px;width:38px;height:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .btn svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5;fill:none;transition:transform .3s}
  .btn.up svg{transform:rotate(180deg)}
</style>
</head>
<body>
<div class="box">
  <div id="list">
    <div class="item" id="b-rose" data-k="rose" data-o="1"><div class="ico">🌹<span class="cnt" id="c-rose">0</span></div><div class="txt"><div class="nm">ᴍᴀᴡᴀʀ 🧣</div><div class="ch">Salah 1 warna</div></div></div>
    <div class="item" id="b-doughnut" data-k="doughnut" data-o="2"><div class="ico">🍩<span class="cnt" id="c-doughnut">0</span></div><div class="txt"><div class="nm">ᴅᴏɴᴀᴛ 🥨</div><div class="ch">Putar 90°</div></div></div>
    <div class="item" id="b-star" data-k="star" data-o="3"><div class="ico">✨<span class="cnt" id="c-star">0</span></div><div class="txt"><div class="nm">ᴄᴀʜᴀʏᴀ ʙɪɴᴛᴀɴɢ 💫</div><div class="ch">Tanpa pinset 30d</div></div></div>
    <div class="item" id="b-bravo" data-k="bravo" data-o="4"><div class="ico">👏<span class="cnt" id="c-bravo">0</span></div><div class="txt"><div class="nm">ʙʀᴀᴠᴏ 🏵</div><div class="ch">Senggol papan</div></div></div>
    <div class="item" id="b-loveyou" data-k="loveyou" data-o="5"><div class="ico">🤟<span class="cnt" id="c-loveyou">0</span></div><div class="txt"><div class="nm">ᴀᴋᴜ ᴄɪɴᴛᴀ ᴋᴀᴍᴜ 💝</div><div class="ch">Rusak 1 bagian</div></div></div>
    <div class="item" id="b-perfume" data-k="perfume" data-o="6"><div class="ico">🧴<span class="cnt" id="c-perfume">0</span></div><div class="txt"><div class="nm">ᴘᴀʀғᴜᴍ 🦢</div><div class="ch">BALIK PAPAN!</div></div></div>
    <div class="item" id="b-whale" data-k="whale" data-o="7"><div class="ico">🐳<span class="cnt" id="c-whale">0</span></div><div class="txt"><div class="nm">ᴘᴀᴜs ᴍᴇɴʏᴇʟᴀᴍ 🫧</div><div class="ch">SETRIKAA</div></div></div>
  </div>
  <div class="ft"><button class="btn" id="arr" onclick="stepScroll()"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button></div>
</div>
<script>
const cnt={rose:0,doughnut:0,star:0,bravo:0,loveyou:0,perfume:0,whale:0};
const list=document.getElementById('list'),arr=document.getElementById('arr');
let idleT,scrI,dir=1,pause=false,actx;

function beep(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime,o1=actx.createOscillator(),g1=actx.createGain();
    o1.frequency.setValueAtTime(1046.5,t);g1.gain.setValueAtTime(.25,t);g1.gain.exponentialRampToValueAtTime(.001,t+.3);
    o1.connect(g1);g1.connect(actx.destination);o1.start(t);o1.stop(t+.3);
    const o2=actx.createOscillator(),g2=actx.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(1318.5,t+.08);g2.gain.setValueAtTime(.25,t+.08);g2.gain.exponentialRampToValueAtTime(.001,t+.5);
    o2.connect(g2);g2.connect(actx.destination);o2.start(t+.08);o2.stop(t+.5);
  }catch(e){}
}

function updArr(){
  const max=list.scrollHeight-list.clientHeight;
  if(list.scrollTop>=max-2)arr.classList.add('up');
  else if(list.scrollTop<=2)arr.classList.remove('up');
}

function startScroll(){
  clearTimeout(idleT);clearInterval(scrI);
  idleT=setTimeout(()=>{
    dir=1;pause=false;
    scrI=setInterval(()=>{
      if(pause)return;
      const max=list.scrollHeight-list.clientHeight;
      if(max<=0)return;
      list.scrollTop+=dir;updArr();
      if(list.scrollTop>=max&&dir===1){pause=true;setTimeout(()=>{dir=-1;pause=false},1500)}
      else if(list.scrollTop<=0&&dir===-1){pause=true;setTimeout(()=>{dir=1;pause=false},1500)}
    },35);
  },3000);
}

function stepScroll(){
  const max=list.scrollHeight-list.clientHeight;
  if(list.scrollTop>=max-4)list.scrollTo({top:0,behavior:'smooth'});
  else list.scrollBy({top:46,behavior:'smooth'});
  setTimeout(updArr,350);startScroll();
}

function sortList(){
  const items=Array.from(list.children);
  items.sort((a,b)=>(cnt[b.dataset.k]-cnt[a.dataset.k])||(a.dataset.o-b.dataset.o));
  items.forEach(i=>list.appendChild(i));
  list.scrollTop=0;updArr();
}

function addGift(k,q=1){
  if(!cnt.hasOwnProperty(k))return;
  cnt[k]+=q;
  document.getElementById('c-'+k).innerText=cnt[k];
  beep();sortList();
  const b=document.getElementById('b-'+k);
  b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  startScroll();
}

function resetAll(){
  for(let k in cnt){cnt[k]=0;document.getElementById('c-'+k).innerText=0}
  sortList();startScroll();
}

document.addEventListener('keydown',e=>{
  const ord=['rose','doughnut','star','bravo','loveyou','perfume','whale'];
  const n=parseInt(e.key);
  if(n>=1&&n<=7)addGift(ord[n-1],1);
  else if(e.key==='0'||e.key.toLowerCase()==='r')resetAll();
});

list.addEventListener('wheel',()=>{updArr();startScroll()});

function conn(){
  try{
    const ws=new WebSocket("ws://localhost:8080");
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.type==='gift'){
        const s=(m.giftName||"").toLowerCase(),q=m.count||1;
        if(s.includes("rose")||s.includes("mawar"))addGift("rose",q);
        else if(s.includes("doughnut")||s.includes("donut")||s.includes("donat"))addGift("doughnut",q);
        else if(s.includes("star")||s.includes("bintang"))addGift("star",q);
        else if(s.includes("bravo"))addGift("bravo",q);
        else if(s.includes("love")||s.includes("cinta"))addGift("loveyou",q);
        else if(s.includes("perfume")||s.includes("parfum"))addGift("perfume",q);
        else if(s.includes("whale")||s.includes("paus"))addGift("whale",q);
      }else if(m.type==='reset')resetAll();
    };
    ws.onclose=()=>setTimeout(conn,3000);
  }catch(e){}
}
conn();startScroll();
</script>
</body>
</html>
