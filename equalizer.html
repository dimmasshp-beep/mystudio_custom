<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Equalizer Widget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #eqContainer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    height: 110px;
    padding: 10px;
  }
  .eq-bar {
    width: 14px;
    height: 10px;
    background-color: #ffffff;
    border-radius: 3px;
    transition: height 0.05s ease-out;
  }
</style>
</head>
<body>

  <div id="eqContainer"></div>

  <script>
    const eqContainer = document.getElementById('eqContainer');
    const BAR_COUNT = 22;
    const bars = [];

    // Pastikan 22 balok putih langsung muncul di layar
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'eq-bar';
      eqContainer.appendChild(bar);
      bars.push(bar);
    }

    async function initEqualizer() {
      try {
        // Minta izin audio awal untuk membaca daftar perangkat
        const initialStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();

        // Cari otomatis perangkat VB-Cable atau Stereo Mix jika terpasang
        const virtualCable = devices.find(d =>
          d.kind === 'audioinput' &&
          (d.label.toLowerCase().includes('cable output') || d.label.toLowerCase().includes('stereo mix'))
        );

        let finalStream = initialStream;
        if (virtualCable) {
          initialStream.getTracks().forEach(t => t.stop());
          finalStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: virtualCable.deviceId },
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const source = audioCtx.createMediaStreamSource(finalStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.72;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function animate() {
          requestAnimationFrame(animate);
          analyser.getByteFrequencyData(dataArray);

          for (let i = 0; i < BAR_COUNT; i++) {
            const freqIndex = Math.floor((i / BAR_COUNT) * (dataArray.length * 0.65));
            const value = dataArray[freqIndex] || 0;
            const heightPx = Math.max(10, Math.round((value / 255) * 95));
            bars[i].style.height = heightPx + 'px';
          }
        }
        animate();

      } catch (err) {
        console.warn("Izin audio belum aktif:", err);
      }
    }

    window.addEventListener('load', initEqualizer);
  </script>
</body>
</html>
