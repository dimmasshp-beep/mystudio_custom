<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transparent Equalizer Widget</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0) !important;
    background: transparent !important;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #eqContainer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    height: 110px;
    padding: 10px;
    background: transparent !important;
  }
  .eq-bar {
    width: 14px;
    height: 10px;
    background-color: #ffffff;
    border-radius: 3px;
    transition: height 0.05s ease-out;
  }
</style>
</head>
<body>

  <div id="eqContainer"></div>

  <script>
    const eqContainer = document.getElementById('eqContainer');
    const BAR_COUNT = 22;
    const bars = [];

    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'eq-bar';
      eqContainer.appendChild(bar);
      bars.push(bar);
    }

    async function startTransparentEqualizer() {
      try {
        const initialStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();

        const virtualDevice = devices.find(d =>
          d.kind === 'audioinput' &&
          (d.label.toLowerCase().includes('cable output') || d.label.toLowerCase().includes('stereo mix'))
        );

        let streamToUse = initialStream;
        if (virtualDevice) {
          initialStream.getTracks().forEach(t => t.stop());
          streamToUse = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: virtualDevice.deviceId },
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const source = audioCtx.createMediaStreamSource(streamToUse);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.72;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function render() {
          requestAnimationFrame(render);
          analyser.getByteFrequencyData(dataArray);

          for (let i = 0; i < BAR_COUNT; i++) {
            const freqIndex = Math.floor((i / BAR_COUNT) * (dataArray.length * 0.65));
            const value = dataArray[freqIndex] || 0;
            const heightPx = Math.max(10, Math.round((value / 255) * 95));
            bars[i].style.height = heightPx + 'px';
          }
        }
        render();

      } catch (err) {
        console.warn("Menunggu akses audio:", err);
      }
    }

    window.addEventListener('load', startTransparentEqualizer);
  </script>
</body>
</html>
