<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok LIVE Equalizer</title>
<script src="https://unpkg.com"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Tampilan Kontrol Hanya untuk Chrome */
  #senderBox {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: #181818;
    border: 1px solid #333;
    padding: 24px 32px;
    border-radius: 16px;
    color: #fff;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #connectBtn {
    background: #fe2c55;
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  #connectBtn:hover {
    transform: scale(1.04);
  }
  #statusMsg {
    font-size: 13px;
    color: #aaa;
    max-width: 300px;
    line-height: 1.5;
  }

  /* Kanvas Equalizer Murni (Tanpa Tombol) */
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
  }
</style>
</head>
<body>

  <div id="senderBox">
    <button id="connectBtn">Hubungkan Audio Chrome</button>
    <p id="statusMsg">Klik tombol di atas, pilih tab <b>TikTok</b> atau <b>Seluruh Layar</b>, lalu centang <b>Bagikan audio</b>.</p>
  </div>

  <canvas id="eqCanvas" width="520" height="120"></canvas>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isWidget = params.get('view') === 'widget';
    const roomId = "dimmasshp-tiktok-eq-bridge-2026";

    const senderBox = document.getElementById('senderBox');
    const connectBtn = document.getElementById('connectBtn');
    const statusMsg = document.getElementById('statusMsg');
    const canvas = document.getElementById('eqCanvas');
    const ctx = canvas.getContext('2d');

    const CONFIG = {
      barCount: 22,
      maxBlocks: 12,
      blockWidth: 18,
      blockHeight: 5,
      gapX: 5,
      gapY: 3
    };

    let currentFreq = new Array(64).fill(0);
    let lastUpdate = 0;

    function drawEqualizer(freqArray) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const totalWidth = CONFIG.barCount * (CONFIG.blockWidth + CONFIG.gapX) - CONFIG.gapX;
      const startX = (canvas.width - totalWidth) / 2;
      const baseY = canvas.height - 15;

      for (let i = 0; i < CONFIG.barCount; i++) {
        const freqIndex = Math.floor((i / CONFIG.barCount) * (freqArray.length * 0.65));
        const value = freqArray[freqIndex] || 0;
        const activeBlocks = Math.max(1, Math.round((value / 255) * CONFIG.maxBlocks));
        const x = startX + i * (CONFIG.blockWidth + CONFIG.gapX);

        for (let b = 0; b < activeBlocks; b++) {
          const y = baseY - b * (CONFIG.blockHeight + CONFIG.gapY);
          ctx.fillStyle = (b === activeBlocks - 1 && activeBlocks > 2)
            ? "rgba(255, 255, 255, 0.75)"
            : "rgba(255, 255, 255, 0.95)";
          ctx.fillRect(x, y, CONFIG.blockWidth, CONFIG.blockHeight);
        }
      }
    }

    // ==========================================
    // MODE 1: TIKTOK LIVE STUDIO (?view=widget)
    // ==========================================
    if (isWidget) {
      const peer = new Peer(roomId);

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data && data.freq) {
            currentFreq = data.freq;
            lastUpdate = Date.now();
          }
        });
      });

      function renderWidget() {
        requestAnimationFrame(renderWidget);
        if (Date.now() - lastUpdate > 250) {
          currentFreq = currentFreq.map(v => Math.max(0, v - 18));
        }
        drawEqualizer(currentFreq);
      }
      renderWidget();

    // ==========================================
    // MODE 2: GOOGLE CHROME (PENGIRIM AUDIO)
    // ==========================================
    } else {
      senderBox.style.display = 'flex';
      canvas.style.display = 'none';

      const peer = new Peer();
      let dataConn = null;

      function connectToWidget() {
        dataConn = peer.connect(roomId);
        dataConn.on('open', () => {
          statusMsg.innerHTML = "Jembatan ke <b>TikTok LIVE Studio</b> siap! Klik tombol merah untuk mulai mengirim suara.";
        });
      }

      peer.on('open', connectToWidget);

      connectBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });

          const audioTracks = stream.getAudioTracks();
          if (audioTracks.length === 0) {
            alert("Centang kotak 'Bagikan juga audio tab' atau 'Bagikan audio sistem' saat memilih layar!");
            stream.getTracks().forEach(t => t.stop());
            return;
          }

          if (!dataConn || !dataConn.open) {
            connectToWidget();
          }

          connectBtn.textContent = "Aktif & Terhubung ke LIVE Studio";
          connectBtn.style.background = "#00c853";
          statusMsg.innerHTML = "Suara Chrome sedang dikirim otomatis ke <b>TikTok LIVE Studio</b>. Jangan tutup tab ini.";

          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.78;
          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);

          function sendAudioLoop() {
            requestAnimationFrame(sendAudioLoop);
            analyser.getByteFrequencyData(dataArray);
            if (dataConn && dataConn.open) {
              dataConn.send({ freq: Array.from(dataArray) });
            }
          }
          sendAudioLoop();

          audioTracks.onended = () => {
            connectBtn.textContent = "Hubungkan Audio Chrome";
            connectBtn.style.background = "#fe2c55";
            statusMsg.textContent = "Koneksi audio terputus. Klik tombol di atas untuk menghubungkan ulang.";
          };

        } catch (err) {
          console.error(err);
        }
      });
    }
  </script>
</body>
</html>
