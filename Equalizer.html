<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Equalizer Widget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #eqContainer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    height: 100px;
    padding: 10px;
  }
  .eq-bar {
    width: 14px;
    height: 8px;
    background-color: #ffffff;
    border-radius: 3px;
    transition: height 0.05s ease-out;
  }
</style>
</head>
<body>

  <div id="eqContainer"></div>

  <script>
    const eqContainer = document.getElementById('eqContainer');
    const BAR_COUNT = 22;
    const bars = [];

    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'eq-bar';
      eqContainer.appendChild(bar);
      bars.push(bar);
    }

    async function startAutoEqualizer() {
      try {
        // Otomatis meminta akses saluran audio input sistem tanpa tombol klik
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: false
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.72;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function renderLoop() {
          requestAnimationFrame(renderLoop);
          analyser.getByteFrequencyData(dataArray);

          for (let i = 0; i < BAR_COUNT; i++) {
            const freqIndex = Math.floor((i / BAR_COUNT) * (dataArray.length * 0.65));
            const value = dataArray[freqIndex] || 0;
            const heightPx = Math.max(8, Math.round((value / 255) * 90));
            bars[i].style.height = heightPx + 'px';
          }
        }
        renderLoop();

      } catch (err) {
        console.error("Menunggu akses audio sistem:", err);
      }
    }

    // Jalankan otomatis begitu halaman terbuka
    window.addEventListener('load', startAutoEqualizer);
  </script>
</body>
</html>
