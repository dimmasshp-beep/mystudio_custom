<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Live Music Alert - GitHub Pages</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Kapsul Alert Utama */
    .pill {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 24px 10px 12px;
      max-width: 440px;
      background: rgba(16, 18, 28, 0.92);
      border: 1px solid rgba(255, 215, 130, 0.45);
      border-radius: 99px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      opacity: 0;
      transform: translateY(-45px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill.show { opacity: 1; transform: translateY(0); }

    .vinyl {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #181822;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      animation: spin 6s linear infinite;
    }

    .vinyl img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #ffd782;
      object-fit: cover;
    }

    .info { overflow: hidden; }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffd782;
      margin-bottom: 2px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info span { display: block; font-size: 12px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Subtitle 1 Baris Efek Slide-Up */
    .sub {
      margin-top: 12px;
      padding: 8px 20px;
      max-width: 460px;
      background: rgba(12, 14, 22, 0.90);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 99px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sub.on { opacity: 1; transform: translateY(0); }
    .sub b { color: #ffd782; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="pill" id="pill">
    <div class="vinyl"><img id="pic" src=""></div>
    <div class="info">
      <div class="badge"><i class="dot" id="statusDot"></i><small id="tag">LIVE MUSIC</small></div>
      <b id="user">cumaniniajaa</b>
      <span id="msg">Menghubungkan ke server lokal...</span>
    </div>
  </div>

  <div class="sub" id="sub"></div>

  <script>
    const pill = document.getElementById('pill');
    const sub = document.getElementById('sub');
    const dot = document.getElementById('statusDot');
    const aQ = [], tQ = [];
    let aRun = false, tRun = false;

    // 1. Subtitle & Suara TTS Ngebass
    function speak(teks, html, prio = false) {
      if (!teks) return;
      if (prio) tQ.unshift({ teks, html });
      else if (tQ.length < 6) tQ.push({ teks, html });
      nextTTS();
    }

    function nextTTS() {
      if (tRun || !tQ.length) return;
      tRun = true;
      const cur = tQ.shift();

      sub.innerHTML = cur.html;
      sub.classList.add('on');

      const durasiTampil = Math.max(3000, cur.teks.length * 75);
      let selesai = false;

      const akhiri = () => {
        if (selesai) return;
        selesai = true;
        sub.classList.remove('on');
        setTimeout(() => { tRun = false; nextTTS(); }, 350);
      };

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(cur.teks);
        u.lang = 'id-ID';
        u.rate = 0.94;
        u.pitch = 0.72;

        const v = speechSynthesis.getVoices();
        u.voice = v.find(x => x.lang.includes('id') && (x.name.includes('Ardi') || x.name.toLowerCase().includes('male'))) || v.find(x => x.lang.includes('id'));

        u.onend = akhiri;
        u.onerror = akhiri;
        speechSynthesis.speak(u);
      }

      setTimeout(akhiri, durasiTampil + 1000);
    }

    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // 2. Kapsul Alert
    function alertBox(tag, user, msg, pic, tts = '', html = '') {
      aQ.push({ tag, user, msg, pic, tts, html });
      nextAlert();
    }

    function nextAlert() {
      if (aRun || !aQ.length) return;
      aRun = true;
      const d = aQ.shift();

      document.getElementById('tag').innerText = d.tag;
      document.getElementById('user').innerText = d.user;
      document.getElementById('msg').innerText = d.msg;
      document.getElementById('pic').src = d.pic || `https://dicebear.com{encodeURIComponent(d.user)}`;

      pill.classList.add('show');
      if (d.tts) speak(d.tts, d.html, true);

      setTimeout(() => {
        pill.classList.remove('show');
        setTimeout(() => { aRun = false; nextAlert(); }, 500);
      }, 4200);
    }

    // 3. Koneksi WebSocket ke server.js di komputer (127.0.0.1:8080)
    function connect() {
      try {
        const ws = new WebSocket('ws://127.0.0.1:8080');

        ws.onopen = () => {
          dot.classList.add('ok');
          alertBox('TERHUBUNG ✅', 'Server Lokal Aktif', 'Siap membaca YouTube & TikTok!', '',
            'Penghubung aktif.', '✅ <b>Penghubung lokal</b> berhasil terhubung!');
        };

        ws.onmessage = (e) => {
          const d = JSON.parse(e.data);
          const nama = d.user || 'Penonton';

          if (d.type === 'song') {
            alertBox('🎵 NOW PLAYING', d.title, 'Sedang diputar di YouTube Chrome', '', '', '');
          }
          if (d.type === 'follow') {
            alertBox('NEW FOLLOWER', nama, 'Masuk antrean live music!', d.avatar,
              `Terima kasih ${nama}, sudah follow.`, `🎙️ Terima kasih <b>${nama}</b>, sudah follow!`);
          }
          if (d.type === 'gift') {
            const jml = d.count > 1 ? ` ${d.count} kali` : '';
            alertBox('NEW GIFT ✨', nama, `Kirim ${d.giftName}${d.count > 1 ? ' x' + d.count : ''}!`, d.avatar,
              `Terima kasih ${nama}, sudah kirim ${d.giftName}${jml}.`, `🎙️ Terima kasih <b>${nama}</b>, kirim ${d.giftName}${jml}!`);
          }
          if (d.type === 'chat' && d.comment) {
            const teks = d.comment.replace(/[^\p{L}\p{N}\s.,?!]/gu, '').trim();
            if (teks) speak(`${nama} bilang, ${teks}`, `💬 <b>${nama}:</b> "${teks}"`);
          }
        };

        ws.onclose = () => {
          dot.classList.remove('ok');
          setTimeout(connect, 3000);
        };
      } catch (err) {
        dot.classList.remove('ok');
      }
    }

    // Jalankan tes awal saat link GitHub dibuka
    alertBox('LIVE MUSIC', 'cumaniniajaa', 'GitHub Pages Alert Siap!', '',
      'Tes suara dan subtitle aktif.', '🎙️ <b>Tes subtitle</b> 1 baris aktif!');
    connect();
  </script>

</body>
</html>
